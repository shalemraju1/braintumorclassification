{% extends "base.html" %}

{% block content %}
<div class="auth-wrap">
    <section class="auth-card">
        <p class="eyebrow">Create account</p>
        <h1>Medical Staff Registration</h1>
        <p>Register a secure account to review MRI predictions, save reports, and keep your workflow organized.</p>

        <form class="form-grid" method="POST">
            <div class="form-field">
                <label for="username">Full Name</label>
                <input id="username" type="text" name="username" placeholder="Dr. Alex Morgan" required>
            </div>
            <div class="form-field">
                <label for="email">Email Address</label>
                <input id="email" type="email" name="email" placeholder="doctor@hospital.com" required>
            </div>
            <div class="form-field">
                <label for="password">Password</label>
                <input id="password" type="password" name="password" placeholder="Create a secure password" required>
            </div>
            <button class="btn btn-primary" type="submit">Register</button>
        </form>

        <p style="margin-top: 18px;">Already have an account? <a href="{{ url_for('web.login') }}">Login</a></p>
    </section>
</div>
{% endblock %}
