{% extends "base.html" %}

{% block content %}
<div class="auth-wrap">
    <section class="auth-card">
        <p class="eyebrow">Secure access</p>
        <h1>Doctor Login</h1>
        <p>Sign in to access the clinical dashboard, run predictions, and manage history reports.</p>

        <form class="form-grid" method="POST">
            <div class="form-field">
                <label for="email">Email Address</label>
                <input id="email" type="email" name="email" placeholder="doctor@hospital.com" required>
            </div>
            <div class="form-field">
                <label for="password">Password</label>
                <input id="password" type="password" name="password" placeholder="••••••••" required>
            </div>
            <button class="btn btn-primary" type="submit">Login</button>
        </form>

        <p style="margin-top: 18px;">Don't have an account? <a href="{{ url_for('web.register') }}">Create one</a></p>
    </section>
</div>
{% endblock %}
